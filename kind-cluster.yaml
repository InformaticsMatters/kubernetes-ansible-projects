---

# A kind (https://kind.sigs.k8s.io) configuration for a single-node local
# cluster that can run the Squonk2 playbooks. It provides: -
#
# - An API server on 127.0.0.1:6443 whose certificate is also valid for
#   'kubernetes.docker.internal' (so it can be reached from the devcontainer)
# - The node labels our playbooks expect ('informaticsmatters.com/purpose-*')
# - Host ports 80 and 443 mapped to the node, for the nginx ingress controller
#
# Create the cluster (and its kubeconfig) with: -
#
#   kind create cluster --name squonk2 --image kindest/node:v1.32.8 \
#       --config kind-cluster.yaml --kubeconfig ~/k8s-config/kind-squonk2.yaml
#
# ...and then install the nginx ingress controller: -
#
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 6443
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    certSANs:
    - localhost
    - 127.0.0.1
    - kubernetes.docker.internal
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true,informaticsmatters.com/purpose-core=yes,informaticsmatters.com/purpose-application=yes,informaticsmatters.com/purpose-worker=yes"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    listenAddress: 0.0.0.0
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    listenAddress: 0.0.0.0
    protocol: TCP
